{% extends "base.html" %}
{% block title %}The Booking Room{% endblock %}

{% block content %}
<div class="menu-scene">
  <img src="{{ url_for('static', filename='hub/main_menu_desktop.png') }}"
       class="menu-bg menu-bg-desktop" alt="The Booking Room">
  <img src="{{ url_for('static', filename='hub/main_menu_mobile.png') }}"
       class="menu-bg menu-bg-mobile" alt="The Booking Room">

  <!-- DOOR → Setup (new game). Calibrate the % to each image. -->
  <a href="{{ url_for('new_game') }}" class="menu-hotspot menu-door-desktop"
     style="left:37%; top:6%; width:26%; height:80%;" data-label="▶ New Promotion"></a>
  <a href="{{ url_for('new_game') }}" class="menu-hotspot menu-door-mobile"
     style="left:23%; top:11%; width:54%; height:72%;" data-label="▶ New Promotion"></a>

  {% if saves %}
  <!-- SUITCASE → Load most recent save -->
  <a href="{{ url_for('load_game', save_name=saves[0].name if saves[0].name is defined else saves[0]) }}"
     class="menu-hotspot menu-case-desktop"
     style="left:52%; top:68%; width:14%; height:22%;" data-label="📂 Continue"></a>
  <a href="{{ url_for('load_game', save_name=saves[0].name if saves[0].name is defined else saves[0]) }}"
     class="menu-hotspot menu-case-mobile"
     style="left:57%; top:74%; width:26%; height:16%;" data-label="📂 Continue"></a>
  {% endif %}
</div>
{% endblock %}
